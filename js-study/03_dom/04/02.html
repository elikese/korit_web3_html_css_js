<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" class="todo-input">
    <button class="todo-btn">입력</button>
    <button class="save-btn">저장</button>
    <button class="load-btn">불러오기</button>
    <ul class="todo-list"></ul>
</body>
<script>
    const todoInput = document.querySelector(".todo-input");
    const todoBtn = document.querySelector(".todo-btn");
    const saveBtn = document.querySelector(".save-btn");
    const loadBtn = document.querySelector(".load-btn");
    const todoUl = document.querySelector(".todo-list");

    let todos = [];

    const render = () => {
        // 1. 주입해줄 HTML 조립
        let myHtml = "";
        for(let todo of todos) {
            myHtml += `
                <li>${todo.text}</li>
            `
        }
        // 2. 한번만 주입
        todoUl.innerHTML = myHtml;
    }

    // 전역 todos를 로컬스토리지에 저장
    saveBtn.addEventListener("click", () => {
        // "todos" key로 로컬스토리지에 저장
        alert("저장완료");
    })

    loadBtn.addEventListener("click", () => {
        // 로컬스토리지에 있는 리스트를 가져와서
        // todos에 대입 -> 렌더링
    })

    // input에 입력한 값을 todos에 추가
    todoBtn.addEventListener("click", () => {
        const value = todoInput.value;
        
        if (value === "") {
            alert("비어있을 수 없습니다");
            return;
        }

        // todos = [...todos, { text: value }];
        todos.push({text: value});
        todoInput.value = "";
        render();
    })
</script>
</html>
